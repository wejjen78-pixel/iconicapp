name: Checar taxas de comissão (leitura)

on:
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: robo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Rodar
        env:
          ICONIC_EMAIL: ${{ secrets.ICONIC_EMAIL }}
          ICONIC_SENHA: ${{ secrets.ICONIC_SENHA }}
        run: node checar-taxas.mjs
