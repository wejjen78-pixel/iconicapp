name: Lançamento diário (AppBarber + Cel Cash)

on:
  schedule:
    # Três horários, não um: na prática os disparos atrasam de forma
    # imprevisível (já vimos o mesmo cron sair entre 11h e 19h UTC, sem
    # padrão fixo ligado ao minuto) — mudar só o horário não resolve.
    # Rodar várias vezes por dia aumenta a chance de pelo menos um disparo
    # vir na hora certa, e é seguro: tanto o AppBarber quanto o Cel Cash
    # pulam o que já foi lançado, então uma execução a mais não duplica
    # nada se uma anterior já tiver dado certo — só serve de rede de
    # segurança se alguma atrasar demais ou simplesmente não vier.
    #
    # Horário principal: 23:11 em Brasília (dia já fechado, lança HOJE à
    # noite — ver "Definir dia alvo" abaixo pra regra de qual dia cada
    # horário lança).
    - cron: "11 2 * * *"
    # Reforços pela manhã/tarde, cobrindo o dia anterior caso o de 23h
    # atrase demais ou não venha.
    - cron: "7 9 * * *"
    - cron: "7 18 * * *"
    # O último dia do mês é pulado em todos: o dono lança à mão no fechamento.
  workflow_dispatch:
    inputs:
      data:
        description: "Dia a lançar (AAAA-MM-DD). Vazio = ontem."
        required: false
      data_fim:
        description: "Ressincronizar Cel Cash de 'data' até aqui (AAAA-MM-DD). Só vale com partes=celcash — recupera lacunas de um período sem duplicar nada."
        required: false
      previa:
        description: "Só prévia (não grava nada)"
        type: boolean
        default: true
      partes:
        description: "Partes a rodar"
        type: choice
        default: appbarber,celcash,relatorio
        options:
          - appbarber,celcash,relatorio
          - appbarber,celcash
          - relatorio
          - appbarber
          - celcash
      backup:
        description: "Fazer o backup no final"
        type: boolean
        default: false
      testar_aviso:
        description: "Mandar um aviso de falha de teste para o celular"
        type: boolean
        default: false

concurrency:
  group: lancamento-diario
  cancel-in-progress: false

jobs:
  lancar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: robo
    steps:
      - name: Definir dia alvo
        id: alvo
        working-directory: .
        run: |
          data="${{ inputs.data }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Depois das 21h em Brasília o dia já fechou: lança HOJE (é o
            # horário de 23h). Antes disso, é um reforço de manhã/tarde
            # cobrindo o dia ANTERIOR, que já devia ter fechado há horas.
            hora=$(TZ=America/Sao_Paulo date +%H)
            if [ "$hora" -ge 21 ]; then
              data=$(TZ=America/Sao_Paulo date +%F)
            else
              data=$(TZ=America/Sao_Paulo date -d 'yesterday' +%F)
            fi
            # Último dia do mês é lançado à mão pelo dono no fechamento (~20h);
            # lançar de novo aqui duplicaria o pote do Cel Cash.
            if [ "$(date -d "$data +1 day" +%d)" = "01" ]; then
              echo "$data é o último dia do mês (fechamento manual) — pulado."
              echo "pular=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "data=$data" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.alvo.outputs.pular != 'true'
      - uses: actions/setup-node@v4
        if: steps.alvo.outputs.pular != 'true'
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        if: steps.alvo.outputs.pular != 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.alvo.outputs.pular != 'true'
      - name: Rodar robô
        if: steps.alvo.outputs.pular != 'true'
        env:
          APPBARBER_EMAIL: ${{ secrets.APPBARBER_EMAIL }}
          APPBARBER_SENHA: ${{ secrets.APPBARBER_SENHA }}
          ICONIC_EMAIL: ${{ secrets.ICONIC_EMAIL }}
          ICONIC_SENHA: ${{ secrets.ICONIC_SENHA }}
          DATA: ${{ steps.alvo.outputs.data }}
          DATA_FIM: ${{ inputs.data_fim }}
          PREVIA: ${{ inputs.previa && '1' || '0' }}
          PARTES: ${{ inputs.partes || 'appbarber,celcash,relatorio' }}
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
          TESTAR_AVISO: ${{ inputs.testar_aviso && '1' || '0' }}
        run: node lancamento-diario.mjs
      - name: Backup diário (pasta privada do Supabase)
        if: always() && steps.alvo.outputs.pular != 'true' && (github.event_name == 'schedule' || inputs.backup)
        env:
          ICONIC_EMAIL: ${{ secrets.ICONIC_EMAIL }}
          ICONIC_SENHA: ${{ secrets.ICONIC_SENHA }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node backup.mjs
