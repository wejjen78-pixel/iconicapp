name: Lançamento diário (AppBarber + Cel Cash)

on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília. Lança o dia anterior, já fechado.
    - cron: "0 9 * * *"
    # 02:30 UTC = 23:30 em Brasília. Só age no último dia do mês (fechamento):
    # lança o próprio dia para o mês fechar sem esperar a manhã seguinte.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      data:
        description: "Dia a lançar (AAAA-MM-DD). Vazio = ontem."
        required: false
      previa:
        description: "Só prévia (não grava nada)"
        type: boolean
        default: true
      partes:
        description: "Partes a rodar"
        type: choice
        default: appbarber,celcash
        options:
          - appbarber,celcash
          - appbarber
          - celcash

concurrency:
  group: lancamento-diario
  cancel-in-progress: false

jobs:
  lancar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: robo
    steps:
      - name: Definir dia alvo
        id: alvo
        working-directory: .
        run: |
          data="${{ inputs.data }}"
          if [ "${{ github.event.schedule }}" = "30 2 * * *" ]; then
            # Volta 3h para cair no dia de Brasília mesmo se o GitHub atrasar o disparo.
            data=$(TZ=America/Sao_Paulo date -d '-3 hours' +%F)
            if [ "$(date -d "$data +1 day" +%d)" != "01" ]; then
              echo "$data não é o último dia do mês — nada a fazer."
              echo "pular=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Fechamento do mês: lançando $data"
          fi
          echo "data=$data" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.alvo.outputs.pular != 'true'
      - uses: actions/setup-node@v4
        if: steps.alvo.outputs.pular != 'true'
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        if: steps.alvo.outputs.pular != 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.alvo.outputs.pular != 'true'
      - name: Rodar robô
        if: steps.alvo.outputs.pular != 'true'
        env:
          APPBARBER_EMAIL: ${{ secrets.APPBARBER_EMAIL }}
          APPBARBER_SENHA: ${{ secrets.APPBARBER_SENHA }}
          ICONIC_EMAIL: ${{ secrets.ICONIC_EMAIL }}
          ICONIC_SENHA: ${{ secrets.ICONIC_SENHA }}
          DATA: ${{ steps.alvo.outputs.data }}
          PREVIA: ${{ inputs.previa && '1' || '0' }}
          PARTES: ${{ inputs.partes || 'appbarber,celcash' }}
        run: node lancamento-diario.mjs
      - name: Guardar prints e planilha
        if: always() && steps.alvo.outputs.pular != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: saida-${{ github.run_id }}
          path: robo/saida
          retention-days: 7
